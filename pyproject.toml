[project]
name = "stock-forensics"
version = "0.1.0"
description = "Forensic check for US stocks: red flags, scores and insider activity, all sourced from SEC EDGAR."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "bernhardbrugger", email = "bernhardbrugger@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "pydantic>=2",
    "rich>=15.0.0",
    "typer>=0.29.1",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.scripts]
forensics = "stock_forensics.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-recording>=0.13",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
