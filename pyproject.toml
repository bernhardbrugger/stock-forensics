[project]
name = "stock-forensics"
version = "0.1.0"
description = "Forensic check for US stocks: red flags, scores and insider activity, all sourced from SEC EDGAR."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "bernhardbrugger", email = "bernhardbrugger@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-recording>=0.13",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
